name: Publish reviewed impact report

on:
  push:
    branches: [main]
    paths:
      - "docs/reports/**"
      - "scripts/publish_report.py"
      - "templates/impact-report.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate and render the reviewed sample report
        run: |
          python3 scripts/publish_report.py \
            --candidates docs/reports/review-candidates.json \
            --report docs/reports/impact-report.md \
            --output-dir _site --public-output
          python3 scripts/publish_report.py --verify-directory _site --public-output
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the sample-only report
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
