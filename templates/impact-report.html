<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service-change impact report</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--cp-bg); color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.6;
    }
    header, main, footer { max-width: 1440px; margin: auto; padding: 24px; }
    main, footer { overflow-wrap: anywhere; }
    header { padding-top: 40px; }
    h1 { margin: 8px 0; font-size: clamp(1.8rem, 4vw, 2.8rem); line-height: 1.2; }
    h2 { margin-top: 40px; padding-bottom: 8px; border-bottom: 1px solid var(--cp-border); }
    h3 { margin-top: 24px; }
    .eyebrow { color: var(--cp-accent); font-weight: 600; letter-spacing: .08em; }
    .muted, footer { color: var(--cp-text-muted); }
    a { color: var(--cp-link); overflow-wrap: anywhere; }
    a:focus-visible, input:focus-visible, select:focus-visible, .table-wrap:focus-visible {
      outline: 2px solid var(--cp-accent); outline-offset: 4px;
    }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin: 24px 0; }
    .stat { display: grid; gap: 4px; padding: 16px; border: 1px solid var(--cp-border); border-radius: 16px; background: var(--cp-surface); }
    .stat strong { font-size: 2rem; line-height: 1.2; }
    .stat span { color: var(--cp-text-muted); }
    .tools { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 16px; background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: .625rem; }
    label { display: grid; gap: 4px; }
    input, select { min-height: 40px; padding: 8px 12px; border: 1px solid var(--cp-border-strong); border-radius: .625rem; color: var(--cp-text); background: var(--cp-surface); font: inherit; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--cp-border); border-radius: .625rem; background: var(--cp-surface); }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: .925rem; }
    th, td { padding: 12px; border-bottom: 1px solid var(--cp-border); vertical-align: top; min-width: 140px; }
    th { background: var(--cp-surface-soft); font-weight: 600; }
    tr:last-child td { border-bottom: 0; }
    tr[hidden] { display: none; }
    tr[data-verdict] td:nth-child(4), tr[data-verdict] td:nth-child(6) { min-width: 260px; }
    .badge { display: inline-block; padding: 4px 8px; color: var(--cp-text); border: 1px solid var(--cp-border); border-radius: .625rem; font-weight: 600; }
    .impacted { border-color: var(--cp-danger); }
    .not-impacted { border-color: var(--cp-success); }
    .needs-investigation { border-color: var(--cp-warning); }
    .cannot-evaluate { border-color: var(--cp-text-muted); }
    .notice { border-left: 4px solid var(--cp-accent); padding: 12px 16px; background: var(--cp-accent-soft); border-radius: .625rem; }
    code { font-family: Consolas, "Courier New", Courier, monospace; font-size: .9em; overflow-wrap: anywhere; }
    @media (max-width: 640px) {
      header, main, footer { padding: 16px; }
      .stats { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .tools label { width: 100%; }
      input, select { width: 100%; }
    }
    @media print {
      .tools { display: none; }
      .table-wrap { overflow: visible; }
      table { font-size: .65rem; }
      th, td, tr[data-verdict] td:nth-child(4), tr[data-verdict] td:nth-child(6) { min-width: 0; padding: 4px; }
      header, main, footer { max-width: none; padding: 8px; }
      h2, h3 { break-after: avoid; }
    }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">MICROSOFT SERVICE CHANGES / EVIDENCE REVIEW</div>
    <h1>Service-change impact report</h1>
    <p class="muted">$evaluated candidate verdicts. Input snapshot: $captured.</p>
    <p>Proposed findings, not human approval. No infrastructure or tenant setting was changed.</p>
    <div class="stats">$counts</div>
    <div class="tools">
      <label>Search verdict rows<input id="search" type="search" placeholder="Notice, configuration, evidence"></label>
      <label>Verdict<select id="verdict"><option value="">All verdicts</option><option>Impacted</option><option>Not impacted</option><option>Needs investigation</option><option>Cannot evaluate</option></select></label>
      <a href="impact-report.md" download>Download Markdown</a>
      <a href="candidates.json" download>Download metadata</a>
      <span id="visible-count" role="status" aria-live="polite"></span>
    </div>
  </header>
  <main>$content</main>
  <footer>$data_boundary</footer>
  <script>
    (() => {
      const explicit = new URLSearchParams(window.location.search).get("scoutTheme");
      if (explicit === "light" || explicit === "dark") document.documentElement.dataset.theme = explicit;
      const search = document.getElementById("search");
      const verdict = document.getElementById("verdict");
      const rows = [...document.querySelectorAll("tr[data-verdict]")];
      const apply = () => {
        const query = search.value.toLowerCase();
        let visible = 0;
        for (const row of rows) {
          row.hidden = !(row.textContent.toLowerCase().includes(query) && (!verdict.value || row.dataset.verdict === verdict.value));
          if (!row.hidden) visible += 1;
        }
        document.getElementById("visible-count").textContent = visible + " / " + rows.length + " verdicts shown";
      };
      search.addEventListener("input", apply);
      verdict.addEventListener("change", apply);
      apply();
    })();
  </script>
</body>
</html>
